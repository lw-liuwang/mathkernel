name: Check MathKernel

on: [push, pull_request]

jobs:
  workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMPDIR: ${{ github.workspace }}/.cache
      MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: mkdir -p "$TMPDIR"
      - uses: actions/cache@v4
        with:
          path: |
            .cache/mathkernel
            lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml', 'lean/lake-manifest.json') }}
      - run: python -m pip install -r requirements-plot.txt
      - run: python tools/setup_lean.py
      - run: python tools/mathkernel.py doctor
      - run: python -m unittest discover -s tests -v
